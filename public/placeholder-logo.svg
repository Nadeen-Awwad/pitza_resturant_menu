<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- تدرج ذهبي للإطار -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    
    <!-- تدرج ذهبي داخلي مشرق -->
    <radialGradient id="goldInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFACD;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </radialGradient>

    <!-- ظل للمظهر المجسم -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- الخلفية الدائرية (العملة) -->
  <circle cx="200" cy="200" r="180" fill="url(#goldOuter)" stroke="#8B4513" stroke-width="5" filter="url(#shadow)" />
  <circle cx="200" cy="200" r="160" fill="url(#goldInner)" stroke="#B8860B" stroke-width="2" />

  <!-- خطوط تقسيم البيتزا -->
  <g stroke="#8B4513" stroke-width="4" stroke-linecap="round">
    <line x1="200" y1="40" x2="200" y2="360" />
    <line x1="40" y1="200" x2="360" y2="200" />
    <line x1="87" y1="87" x2="313" y2="313" />
    <line x1="313" y1="87" x2="87" y2="313" />
  </g>

  <!-- الإضافات العلوية (الدوائر الذهبية الصغيرة) -->
  <circle cx="150" cy="120" r="15" fill="url(#goldOuter)" stroke="#8B4513" stroke-width="1" />
  <circle cx="250" cy="130" r="15" fill="url(#goldOuter)" stroke="#8B4513" stroke-width="1" />
  <circle cx="280" cy="220" r="15" fill="url(#goldOuter)" stroke="#8B4513" stroke-width="1" />
  <circle cx="220" cy="300" r="15" fill="url(#goldOuter)" stroke="#8B4513" stroke-width="1" />
  <circle cx="120" cy="250" r="15" fill="url(#goldOuter)" stroke="#8B4513" stroke-width="1" />

  <!-- لمعة الإطار الخارجي -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.3" />
</svg>
